name: Build Windows detector
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m unittest discover -s apps/detector -p "test_*.py"
      - run: python -m PyInstaller --clean --noconfirm canmypcrunai-detector.spec
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-detector
          path: dist/canmypcrunai-detector.exe
          if-no-files-found: error
