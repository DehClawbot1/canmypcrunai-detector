name: Verify macOS and Linux detector
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/detector/**'
      - 'scripts/**'
      - '.github/workflows/unix.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m unittest discover -s apps/detector -p "test_*.py"
      - run: python scripts/release-unix-detector.py
      - run: python scripts/test-unix-detector.py
      - uses: actions/upload-artifact@v4
        with:
          name: unix-detector-${{ matrix.os }}
          path: |
            apps/web/public/download/canmypcrunai-detector.pyz
            apps/web/public/download/unix-detector-manifest.json
            unix-hardware-profile.json
          if-no-files-found: error
